<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example Trial 2 | Bilingual Cocktail Party</title>
  <style>
    body { margin:0; background:#F6F4F4; color:#3B2B2C; font-family:system-ui,-apple-system,Segoe UI,sans-serif; display:grid; min-height:100svh; place-items:center; }
    main { max-width:460px; width:calc(100% - 48px); background:white; padding:32px; border-radius:20px; box-shadow:0 5px 28px #3B2B2C18; text-align:center; box-sizing:border-box; }
    h1 { font-size:1.6rem; margin:0 0 14px; }
    p { color:#3B2B2C; line-height:1.5; }
    audio { display:block; width:100%; margin:24px auto; accent-color:#145890; }
    .note { font-size:.85rem; color:#65595A; }
  </style>
</head>
<body>
  <main>
    <h1>Example Trial 2</h1>
    <p>Tap play to hear the example auditory stimulus.</p>
    <audio controls preload="metadata" aria-label="Play example trial 2">
      <source src="trial2.mp3" type="audio/mpeg">
      Your browser does not support HTML audio playback.
    </audio>
    <p class="note">Playback occurs in your browser. Headphones recommended.</p>
  </main>
</body>
</html>
